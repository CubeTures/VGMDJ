[project]
name = "vgmdj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"dotenv>=0.9.9",
	"fastapi[standard]>=0.136.1",
	"filelock>=3.29.0",
	"mutagen>=1.47.0",
	"pykhinsider",
	"python-multipart>=0.0.28",
	"requests>=2.34.2",
	"ruff>=0.15.14",
	"uuid-utils>=0.16.0",
]

[tool.ruff]
extend-exclude = ["pykhinsider"]

[tool.ruff.lint]
select = ["I"]

[tool.uv.sources]
pykhinsider = { path = "pykhinsider", editable = true }
